<a
  class="outline-0 m-2 block bg-white dark:bg-gray-900 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition"
  [routerLink]="['/blog', post().id]"
>
  <article class="p-4">
    <h2 class="text-2xl font-semibold text-gray-900 dark:text-gray-100 mb-1">
      {{ post().title }}
    </h2>
    <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">
      <em>{{ post().createdAt }} — por {{ post().author.name }}</em>
    </p>
    <p class="text-gray-700 dark:text-gray-300">
      {{ post().excerpt }}
    </p>

    <div class="flex flex-wrap gap-2 mt-2">
      @for (cat of post().categories; track $index) {
      <small
        class="bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-full px-3 py-1 text-xs"
      >
        {{ cat }}
      </small>
      }
    </div>
  </article>
</a>
